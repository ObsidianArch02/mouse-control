# 探针:验证 Gitea act 是否支持 job 级 container 覆盖,以及
# joseluisq/rust-linux-darwin-builder 镜像(arm64)在 runner 上是否可用。
# Probe: verify Gitea act honors a job-level container override and that the
# joseluisq/rust-linux-darwin-builder image (arm64) works on the runner.
name: probe-container-image

on:
  push:
    branches: [codex/standalone-service]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: joseluisq/rust-linux-darwin-builder:2.0.0-beta.1
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          uname -m
          rustc -vV | head -2
          cargo -vV | head -1
          ls /root/.cargo/config.toml >/dev/null && grep -A3 'aarch64-apple-darwin' /root/.cargo/config.toml
          command -v aarch64-apple-darwin22.4-clang || ls /usr/local/osxcross/target/bin/ 2>/dev/null | head -8 || true
          echo "probe-ok"
