# 每次 main 分支推送都构建 macOS arm64 二进制并发布到 Gitea Release。
# 环境:joseluisq/rust-linux-darwin-builder:2.0.0-beta.1(osxcross,预装 rust stable、
# aarch64-apple-darwin 目标与 macOS SDK),multi-arch,在 arm64 runner 上原生拉取,
# 镜像由 mini 的 docker daemon 缓存,后续 run 不再重复下载 SDK/工具链。
# 注意:镜像里没有 node,Gitea act 用 node 执行 JavaScript action(如 actions/checkout),
# 因此本工作流全部用纯 shell 步骤,自写 clone。
#
# Build the macOS arm64 binary on every push to main and publish it to a Gitea Release.
# Environment: joseluisq/rust-linux-darwin-builder:2.0.0-beta.1 (osxcross, ships stable
# rust, the aarch64-apple-darwin target and a macOS SDK), multi-arch, pulled natively on
# the arm64 runner and cached by the mini's docker daemon, so later runs skip the
# SDK/toolchain downloads entirely.
# Note: this image has no node, and Gitea act executes JavaScript actions (like
# actions/checkout) with node, so this workflow is all plain-shell steps with its own clone.
name: release-macos-arm64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: joseluisq/rust-linux-darwin-builder:2.0.0-beta.1
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # 检出(替代 actions/checkout):容器内先试 host.docker.internal,失败再试 m4mac.local。
      # Checkout (replacing actions/checkout): try host.docker.internal first, then
      # m4mac.local.
      - name: Checkout
        run: |
          set -euo pipefail
          GIT_URL="http://oauth2:${TOKEN}@host.docker.internal:3000/${GITHUB_REPOSITORY}.git"
          if ! git ls-remote "${GIT_URL}" HEAD >/dev/null 2>&1; then
            GIT_URL="http://oauth2:${TOKEN}@m4mac.local:3000/${GITHUB_REPOSITORY}.git"
            git ls-remote "${GIT_URL}" HEAD >/dev/null 2>&1
          fi
          git clone --quiet --no-tags "${GIT_URL}" .
          git checkout --quiet "${GITHUB_SHA}"

      # 工具链与基础工具自检,防止镜像变化时静默出错。
      # Sanity-check the toolchain and base tools so an image change cannot fail silently.
      - name: Build
        run: |
          set -euo pipefail
          uname -m
          rustc --version
          cargo --version
          command -v curl >/dev/null && echo curl-ok
          cargo build --release --locked --target aarch64-apple-darwin
          test -x target/aarch64-apple-darwin/release/mouse-control

      # Apple 的开源 rcodesign(musl 静态构建),默认 ad-hoc 签名。
      # --binary-identifier 与 install 子命令里 codesign 用的 identifier 一致。
      # Apple's open-source rcodesign (musl static build), ad-hoc by default.
      # --binary-identifier matches the identifier used by the install subcommand.
      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) RARCH=aarch64 ;;
            x86_64|amd64)  RARCH=x86_64 ;;
            *) echo "unsupported runner arch: $(uname -m)"; exit 1 ;;
          esac
          curl -fL --retry 3 -o rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-${RARCH}-unknown-linux-musl.tar.gz"
          tar -xzf rcodesign.tar.gz
          find . -name rcodesign -type f | head -1 | xargs -I{} mv {} ./rcodesign
          chmod +x ./rcodesign
          ./rcodesign sign --binary-identifier com.eacryo.mouse-control \
            target/aarch64-apple-darwin/release/mouse-control

      # 发布到 Gitea Release。每次 main 推送用 v<版本>-<sha7> 作标签,保证唯一;
      # 若同标签已存在(重跑同一提交)先删旧 release 与标签再重建,幂等。
      # Publish to a Gitea Release. Each main push gets a unique tag v<version>-<sha7>;
      # if the tag already exists (re-run of the same commit), delete the old release and
      # tag first, so this step is idempotent.
      - name: Publish release
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL}"
          REPO="${GITHUB_REPOSITORY}"
          SHA7="${GITHUB_SHA:0:7}"
          VERSION="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' Cargo.toml | head -1)"
          TAG="v${VERSION}-${SHA7}"
          SUBJECT="$(git log -1 --pretty=%s)"
          # JSON 转义:提交标题可能含引号或反斜杠。
          # JSON-escape: the commit subject may contain quotes or backslashes.
          SUBJECT_ESC="$(printf '%s' "$SUBJECT" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          COMMIT_URL="${GITHUB_SERVER_URL}/${REPO}/commit/${GITHUB_SHA}"
          NAME="mouse-control ${VERSION} (${SHA7})"

          # 已存在的同标签 release 先删(连带标签),保持幂等。
          # Delete a pre-existing release of the same tag (and its tag) for idempotency.
          EXISTING_ID="$(curl -fsSL -H "Authorization: token ${TOKEN}" \
            "${API}/repos/${REPO}/releases/tags/${TAG}" \
            | sed -nE 's/.*"id": *([0-9]+).*/\1/p' | head -1 || true)"
          if [ -n "${EXISTING_ID}" ]; then
            curl -fsS -X DELETE -H "Authorization: token ${TOKEN}" \
              "${API}/repos/${REPO}/releases/${EXISTING_ID}" || true
            curl -fsS -X DELETE -H "Authorization: token ${TOKEN}" \
              "${API}/repos/${REPO}/tags/${TAG}" || true
            echo "Removed pre-existing release ${TAG}"
          fi

          # Gitea 的 release API 不会自动建标签:先用 git 推送标签,再建 release。
          # Gitea's release API does not auto-create tags: push the tag with git first.
          REMOTE="http://oauth2:${TOKEN}@host.docker.internal:3000/${REPO}.git"
          git ls-remote "${REMOTE}" HEAD >/dev/null 2>&1 || \
            REMOTE="http://oauth2:${TOKEN}@m4mac.local:3000/${REPO}.git"
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push --force -q "${REMOTE}" "refs/tags/${TAG}:refs/tags/${TAG}"

          BODY="Auto build from ${SHA7}: ${SUBJECT_ESC}"$'\n'$'\n'"Commit: ${COMMIT_URL}"
          JSON="$(printf '{"tag_name":"%s","name":"%s","body":"%s"}' \
            "${TAG}" "${NAME}" "${BODY}")"
          RESP="$(curl -sS -X POST -H "Authorization: token ${TOKEN}" \
            -H 'Content-Type: application/json' -d "${JSON}" -w '\nHTTP_%{http_code}' \
            "${API}/repos/${REPO}/releases")"
          echo "POST body+code: ${RESP}" | tail -c 600
          RELEASE_ID="$(printf '%s' "${RESP}" | sed -nE 's/.*"id": *([0-9]+).*/\1/p' | head -1)"

          BIN="target/aarch64-apple-darwin/release/mouse-control"
          test -x "${BIN}"
          file "${BIN}" | grep -q 'aarch64'

          curl -fsS -X POST -H "Authorization: token ${TOKEN}" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@${BIN}" \
            "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=mouse-control-darwin-arm64"

          sha256sum "${BIN}" > mouse-control-darwin-arm64.sha256
          curl -fsS -X POST -H "Authorization: token ${TOKEN}" \
            -H 'Content-Type: text/plain' \
            --data-binary "@mouse-control-darwin-arm64.sha256" \
            "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=mouse-control-darwin-arm64.sha256"

          echo "Released ${TAG} -> ${GITHUB_SERVER_URL}/${REPO}/releases/tag/${TAG}"
