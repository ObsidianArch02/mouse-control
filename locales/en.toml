[menu]
enable_mouse = "Enable Mouse Control"
reload_config = "Reload Config"
quit = "Quit"

[errors]
i18n_locale_invalid = 'i18n.locale: "{value}" is not one of auto, en, zh-Hans, zh-Hant'
logging_level_invalid = "logging.level: '{value}' is invalid (expect: debug, info)"
config_read_failed = "cannot read config: {error}"
mouse_scroll_mode_invalid = 'scroll_mode: "{value}" is not one of default, line, pixel, discrete, continuous'
mouse_line_count_invalid = "line_count: {value} must be 1..=20"
mouse_button_map_invalid = 'button_map: "{value}" is not a valid action (format: [modifier+]key, e.g. "ctrl+left")'

[service]
usage = """mouse-control: macOS menu-bar mouse enhancer (managed via Homebrew Services)

USAGE:
    mouse-control [run] [--config <path>] [--log-stdout]   run in the foreground
    mouse-control status [--config <path>]                 show config, service, permission and signing state
    mouse-control sign [--identity <name>]                 sign binary with a local Keychain certificate
    mouse-control --version                                print version

SERVICE MANAGEMENT:
    brew services start mouse-control
    brew services restart mouse-control
    brew services stop mouse-control"""
unknown_command = "unknown command or option: {cmd}"
missing_flag_value = "missing value for option: {flag}"
removed_install_cmd = "the '{cmd}' subcommand was removed. Manage the background service with Homebrew: brew services start|restart|stop mouse-control"
already_running = "mouse-control is already running (pid {pid}), exiting."
op_failed = "{action} failed: {error}"
sign_identity_missing = """code-signing identity "{identity}" was not found in Keychain.
Create a local self-signed Code Signing certificate once:
  1. Open Keychain Access -> Certificate Assistant -> Create a Certificate...
  2. Name: {identity}
  3. Identity Type: Self-Signed Root, Certificate Type: Code Signing
  4. Double-click the certificate in login keychain -> Trust -> Code Signing: Always Trust
Then run: mouse-control sign --identity "{identity}" """
sign_done = "signed binary {path} with identity \"{identity}\""
sign_restart_hint = "restart the service to apply the updated signature: brew services restart mouse-control"
sign_failed = "codesign failed: {error}"
status_this = "binary: {path} (v{version})"
status_config = "config: {path} ({state})"
status_instance_running = "instance: running (pid {pid})"
status_instance_stopped = "instance: not running"
status_accessibility = "accessibility permission: {state}"
status_plist = "homebrew plist: {path} ({state})"
state_present = "present"
state_missing = "missing"
state_granted = "granted"
status_loaded = "launchd ({label}): loaded, pid {pid}, state {state}"
status_not_loaded = "launchd ({label}): not loaded"
status_legacy_warning = "warning: legacy self-installed agent detected ({target}, {plist}, {bin}). Remove it to avoid duplicate instances: launchctl bootout {target}; rm -f {plist} {bin}"
status_requirement = "designated requirement: {req}"
sign_mode_persistent = "signature mode: certificate-bound (persistent across upgrades)"
sign_mode_adhoc = "signature mode: ad-hoc cdhash-bound (resets Accessibility after upgrades; run 'mouse-control sign' with a local certificate)"
