# English locale (fallback). Keys are flattened with dot separators at load time,
# e.g. [menu] enable_mouse  ->  "menu.enable_mouse".
# Keep keys identical across locale files; only values differ.

[menu]
enable_mouse = "Enable Mouse Control"
reload_config = "Reload Config"
quit = "Quit"

[errors]
i18n_locale_invalid = 'i18n.locale: "{value}" is not one of auto, en, zh-Hans, zh-Hant'
logging_level_invalid = "logging.level: '{value}' is invalid (expect: debug, info)"
config_read_failed = "cannot read config: {error}"
mouse_scroll_mode_invalid = 'scroll_mode: "{value}" is not one of default, line, continuous'
mouse_line_count_invalid = "line_count: {value} must be 1..=20"
mouse_button_map_invalid = 'button_map: "{value}" is not a valid action (format: [modifier+]key, e.g. "ctrl+left")'

[service]
usage = """mouse-control: menu-bar mouse enhancer (single binary, launchd service form)

USAGE:
    mouse-control [run]          run in the foreground (menu-bar icon)
    mouse-control install        install as a launchd agent (start at login)
        --sign <identity>        sign with this code-signing identity instead of ad-hoc
    mouse-control uninstall      stop and remove the agent and the installed binary
    mouse-control status         show install, service and signing state
    mouse-control --version      print version"""
unknown_command = "unknown command: {cmd}"
sign_needs_value = "--sign requires an identity name"
op_failed = "{action} failed: {error}"
install_copy = "installed binary: {path}"
install_copy_skip = "already at the install location, re-signing in place: {path}"
sign_identity = 'signed with identity "{identity}"; Accessibility grants survive future reinstalls'
sign_adhoc = "signed ad-hoc; the Accessibility grant is pinned to this exact build and must be re-granted after every reinstall"
sign_cert_hint = 'tip: create a self-signed certificate named "{cert}" in Keychain Access (menu Keychain Access, Certificate Assistant, Create a Certificate, type Code Signing), then re-run install to keep grants across rebuilds'
sign_failed = "codesign failed: {error}"
plist_written = "wrote LaunchAgent plist: {path}"
agent_replaced = "unloaded the previously loaded agent"
agent_booted = "agent loaded and started: {label}"
install_done = "install complete. If Accessibility was granted to a previous build, re-grant it for {path} (System Settings, Privacy & Security, Accessibility)"
not_installed = "not installed (no plist at {path})"
agent_not_loaded = "agent was not loaded"
uninstall_done = "removed agent {label}, its plist and the installed binary"
uninstall_kept = "kept config and logs: {config_dir}, {log_dir}"
status_this = "this binary: {path} (v{version})"
status_installed = "installed binary: {path} ({version})"
status_installed_missing = "installed binary: missing (expected at {path})"
status_plist = "launchd plist: {path} ({state})"
state_present = "present"
state_missing = "missing"
status_loaded = "launchd: loaded, pid {pid}, state {state}"
status_not_loaded = "launchd: not loaded"
status_requirement = "designated requirement: {req}"
