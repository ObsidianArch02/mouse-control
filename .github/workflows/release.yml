name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Tag must start with 'v': $TAG" >&2
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          CARGO_VERSION="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($VERSION) does not match Cargo.toml ($CARGO_VERSION)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package release archive
        id: package
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          BIN="target/aarch64-apple-darwin/release/mouse-control"
          otool -P "$BIN" | grep -q "com.eacryo.mouse-control"
          "$BIN" --version

          PKG_DIR="mouse-control-${TAG}-darwin-arm64"
          ARCHIVE="${PKG_DIR}.tar.gz"

          rm -rf release-out
          mkdir -p "release-out/${PKG_DIR}"
          cp "$BIN" "release-out/${PKG_DIR}/mouse-control"
          cp config.toml README.md LICENSE "release-out/${PKG_DIR}/"
          chmod 0755 "release-out/${PKG_DIR}/mouse-control"

          tar -C release-out -czf "release-out/${ARCHIVE}" "${PKG_DIR}"
          (
            cd release-out
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            cp "${ARCHIVE}.sha256" SHA256SUMS
          )
          SHA256="$(awk '{ print $1 }' "release-out/${ARCHIVE}.sha256")"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

          mkdir -p release-formula
          ARCHIVE="${ARCHIVE}" SHA256="${SHA256}" /usr/bin/ruby -e '
            src = File.read("Formula/mouse-control.rb")
            repo = ENV.fetch("REPO")
            tag = ENV.fetch("TAG")
            archive = ENV.fetch("ARCHIVE")
            sha256 = ENV.fetch("SHA256")
            version = ENV.fetch("VERSION")
            out = src
              .sub(/homepage ".*"/, %(homepage "https://github.com/#{repo}"))
              .sub(/url ".*"/, %(url "https://github.com/#{repo}/releases/download/#{tag}/#{archive}"))
              .sub(/sha256 ".*"/, %(sha256 "#{sha256}"))
              .sub(/version ".*"/, %(version "#{version}"))
            File.write("release-formula/mouse-control.rb", out)
          '
          /usr/bin/ruby -c release-formula/mouse-control.rb

      - name: Upload rendered Formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: release-formula/mouse-control.rb

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "release-out/${ARCHIVE}" \
              "release-out/${ARCHIVE}.sha256" \
              "release-out/SHA256SUMS" \
              --clobber
          else
            gh release create "$TAG" \
              "release-out/${ARCHIVE}" \
              "release-out/${ARCHIVE}.sha256" \
              "release-out/SHA256SUMS" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download rendered Formula
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: rendered

      - name: Push Formula to Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          DEFAULT_TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set; skipping automatic tap push."
            echo "Configure HOMEBREW_TAP_TOKEN (PAT with contents:write on the tap repo) and optional HOMEBREW_TAP_REPO variable to enable automatic tap updates."
            exit 0
          fi

          TARGET_REPO="${TAP_REPO:-$DEFAULT_TAP_REPO}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TARGET_REPO}.git" tap-repo
          mkdir -p tap-repo/Formula
          cp rendered/mouse-control.rb tap-repo/Formula/mouse-control.rb

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet Formula/mouse-control.rb; then
            echo "Formula/mouse-control.rb is already up to date."
            exit 0
          fi

          git add Formula/mouse-control.rb
          git commit -m "mouse-control ${VERSION}"
          git push
